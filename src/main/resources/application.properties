spring.application.name=RideLanka-FleetHire
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=8080
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# RideLanka progress-demo database (Microsoft SQL Server)
# Change only these three values for your machine.
ridelanka.db.url=${RIDELANKA_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RideLankaFleetHire;encrypt=false;trustServerCertificate=true}
ridelanka.db.username=${RIDELANKA_DB_USERNAME:sa}
ridelanka.db.password=${RIDELANKA_DB_PASSWORD:urPW}
