spring.application.name=RideLanka-FleetHire
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=${PORT:8080}
server.servlet.session.timeout=30m
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
server.error.include-message=never
server.error.include-stacktrace=never

# Microsoft SQL Server is the only persistent data source.
# Set RIDELANKA_DB_PASSWORD in the environment before starting the application.
ridelanka.db.url=${RIDELANKA_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RideLankaFleetHire;encrypt=false;trustServerCertificate=true}
ridelanka.db.username=${RIDELANKA_DB_USERNAME:sa}
ridelanka.db.password=${RIDELANKA_DB_PASSWORD:1234}

# =========================================================
# RideLanka security email notifications
# Gmail SMTP is best-effort: a mail outage/authentication error
# never prevents login or password changes. The demo sender
# address is safe to keep here; keep the Google App Password in
# RIDELANKA_MAIL_PASSWORD rather than committing a credential.
# =========================================================
ridelanka.mail.enabled=${RIDELANKA_MAIL_ENABLED:true}
ridelanka.mail.from=${RIDELANKA_MAIL_FROM:northamerica382@gmail.com}
spring.mail.host=${RIDELANKA_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${RIDELANKA_MAIL_PORT:587}
spring.mail.username=${RIDELANKA_MAIL_USERNAME:northamerica382@gmail.com}
spring.mail.password=${RIDELANKA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000
spring.mail.test-connection=false
spring.mail.default-encoding=UTF-8

